[project]
name = "web-super"
version = "3.2.0"
description = "Hệ thống nghiên cứu khoa học & xuất bản học thuật tích hợp AI toàn diện"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.2",
    "pyzotero>=1.13.0",
    "python-dotenv>=1.0.0",
    "google-auth>=2.20.0",
    "pyjwt>=2.8.0",
    "deep-translator>=1.11.0",
    "google-generativeai>=0.8.0",
    "httpx>=0.27.0",
    "cryptography>=41.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0"
]

[tool.vercel]
entrypoint = "api/index.py"
